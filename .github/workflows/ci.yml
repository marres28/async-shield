name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit and Redis 7 integration tests
        env:
          REDIS_URL: redis://localhost:6379/0
        run: pytest

      - name: Run protected and vulnerable demo smoke check
        env:
          REDIS_URL: redis://localhost:6379/0
        run: |
          python demo/attack_scenario.py --mode=vulnerable
          python demo/attack_scenario.py --mode=protected --insecure-dev-keys
